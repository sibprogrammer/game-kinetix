name: release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Import code-signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/certificate.p12"
          keychain_path="$RUNNER_TEMP/build.keychain-db"

          echo "$CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

      - name: Build macOS DMG
        run: ./build.sh "${{ github.ref_name }}"

      - name: Sign macOS application
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --deep --options runtime --timestamp \
            --sign "$SIGNING_IDENTITY" \
            dist/Kinetix.app
          codesign --verify --deep --strict --verbose=2 dist/Kinetix.app

      - name: Repackage signed DMG
        run: |
          hdiutil create \
            -volname Kinetix \
            -srcfolder dist/Kinetix.app \
            -ov \
            -format UDZO \
            "dist/Kinetix-${{ github.ref_name }}.dmg"

      - name: Create App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: echo "$API_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"

      - name: Notarize and staple DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          xcrun notarytool submit "dist/Kinetix-${{ github.ref_name }}.dmg" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "dist/Kinetix-${{ github.ref_name }}.dmg"
          xcrun stapler validate "dist/Kinetix-${{ github.ref_name }}.dmg"
          spctl --assess --type open --context context:primary-signature \
            --verbose=4 "dist/Kinetix-${{ github.ref_name }}.dmg"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/Kinetix-${{ github.ref_name }}.dmg
